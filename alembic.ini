# Alembic configuration for harness_eval_gateway.
#
# The effective DB URL is NOT taken from this file — `db/migrations/env.py`
# overrides it from `api.config.get_settings().DATABASE_URL` (env var / .env).
#
# Workflow:
#   uv run alembic revision --autogenerate -m "describe change"   # vs live DB
#   uv run alembic upgrade head                                   # apply
#   uv run alembic upgrade head --sql                             # offline SQL
#
# Autogenerate needs a reachable DATABASE_URL (e.g. `docker compose up -d`).

[alembic]
script_location = db/migrations
prepend_sys_path = .
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
