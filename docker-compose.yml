# harness_eval_gateway — local dev topology.
#
# `internal` carries only control-plane traffic (api <-> postgres).
# Ollama runs on the HOST (not containerized for MVP); the api reaches it via
# host.docker.internal (see extra_hosts below + OLLAMA_BASE_URL env).
# Agent sandboxes (F4) will get their OWN internal network later — only the
# AI gateway will be reachable from them (egress lockdown).
#
#   docker compose up -d        # postgres + api
#   docker compose down -v      # stop + wipe pgdata
#
# Published host ports are offset to avoid conflicts with other local
# projects' containers (postgres 5433->5432, api 8001->8000; gateway default 8081).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harness_eval
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harness_eval"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    environment:
      # `postgres` resolves on the `internal` network.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/harness_eval
      # Host Ollama from inside the container (host install, port 11434).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Control-plane -> gateway over compose DNS on `internal` (container
      # port 8080; host-side default stays http://localhost:8081).
      GATEWAY_URL: http://gateway:8080
      ARTIFACT_ROOT: /data/artifacts
      LOG_LEVEL: INFO
      # Shared secret for /api/events/ingest — must match the gateway's.
      INGEST_TOKEN: dev-ingest-token
      # --- Orchestrator (F2) ---
      # HMAC secret for minting sandbox/evaluator creds — MUST match gateway.
      GATEWAY_CRED_SECRET: dev-secret-change-me
      # Judge allowance on top of run spend-at-mint — generous so concurrent
      # participant burn can't starve evaluation (see run 1258852a).
      EVAL_TOKEN_BUDGET: "2000000"
      # Host path of ./data as the docker daemon sees it. Sandbox -v sources
      # (/data/sandboxes/...) are rewritten to this by SandboxRuntime so bind
      # mounts resolve on the host. Requires `docker compose` run from the
      # repo root (the documented flow); override via .env / shell env.
      HOST_DATA_ROOT: ${PWD}/data
      # Optional: pin a different rubric-drafting model (default: run's model).
      RUBRIC_MODEL: ${RUBRIC_MODEL:-}
      # Per-request output caps for the rubric draft + eval judge calls —
      # thinking models burn tokens on <think> blocks; small caps truncate
      # rubric JSON / scores.json into unparseable output.
      RUBRIC_MAX_TOKENS: ${RUBRIC_MAX_TOKENS:-8192}
      EVAL_JUDGE_MAX_TOKENS: ${EVAL_JUDGE_MAX_TOKENS:-8192}
      # Optional GitHub PAT for skillpack import (F11) — private repos +
      # higher rate limits; public repos work without it.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8001:8000"
    volumes:
      # Whole ./data tree: artifacts AND per-sandbox state/workspace dirs.
      # Workspace/skillpack bind-mount sources are host paths under here.
      - ./data:/data
      # Orchestrator spawns sandboxes via the host docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Docker Desktop / Linux bridge -> host gateway (needed for Ollama).
      - "host.docker.internal:host-gateway"
    healthcheck:
      # No curl in python:slim — probe /health with urllib instead.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # F3 — AI gateway: OpenAI-compatible proxy -> host Ollama, with per-run
  # creds, metering events -> api ingest, and token budgets. Sandboxes reach
  # it (and ONLY it) on the internal network; host port 8081 avoids the
  # locally-occupied 8080.
  gateway:
    build: .
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8080
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/harness_eval
      # Host Ollama from inside the container.
      OLLAMA_UPSTREAM_URL: http://host.docker.internal:11434
      # Upstream provider switch: ollama (default) | openrouter (hosted
      # free-tier models for testing). Set in .env (gitignored) — never
      # commit the key here.
      UPSTREAM_PROVIDER: ${UPSTREAM_PROVIDER:-ollama}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      # Control-plane ingest for metering events.
      API_INGEST_URL: http://api:8000
      INGEST_TOKEN: dev-ingest-token
      GATEWAY_CRED_SECRET: dev-secret-change-me
      DEFAULT_RUN_TOKEN_BUDGET: "200000"
      LOG_LEVEL: INFO
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
