[project]
name = "harness-eval-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: tests requiring a live Docker daemon",
    "integration: tests requiring running services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
